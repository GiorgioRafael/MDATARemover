name: Desktop
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar os instaladores verificados em GitHub Releases
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run desktop:check
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged MCP
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node scripts/verify-mcp.mjs --app release/win-unpacked/CleanFrame.exe
          elif [ "$(uname -m)" = "arm64" ]; then
            node scripts/verify-mcp.mjs --app release/mac-arm64/CleanFrame.app/Contents/MacOS/CleanFrame
          else
            node scripts/verify-mcp.mjs --app release/mac/CleanFrame.app/Contents/MacOS/CleanFrame
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CleanFrame-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish_release == true
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CleanFrame-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum installers/*.exe installers/*.dmg > installers/SHA256SUMS.txt
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="desktop-v$(node -p "require('./package.json').version")"
          fi
          gh release create "$release_tag" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CleanFrame ${release_tag#desktop-v}" \
            --notes-file .github/desktop-release-notes.md
